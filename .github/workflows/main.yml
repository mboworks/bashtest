name: Test
on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-site-tests:
    name: Release site tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          cache-save: false
          bazelisk-cache: true
      - name: Verify configured documentation and generated links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This is a disposable build on the runner, never a Pages publication.
          bazel run //tools:release_site -- "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/release-site-check" \
            --repository "${GITHUB_REPOSITORY}" --tag 0.0.0-verification --latest ""

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - uses: pre-commit/action@v3.0.1
      - uses: pre-commit-ci/lite-action@v1.2.0
        if: always()

  test:
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Configure report capture
      shell: bash
      run: |
        mkdir -p "${RUNNER_TEMP}/test-results"
        echo "BASHTEST_CI_REPORTS=${RUNNER_TEMP}/test-results" >> "${GITHUB_ENV}"
    - uses: bazel-contrib/setup-bazel@0.19.1
      with:
        cache-save: ${{ github.ref == 'refs/heads/main' }}
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}
        # Share repository cache between workflows.
        repository-cache: true
    - name: Built & Test
      if: runner.os != 'Windows'
      shell: bash
      env:
        MSYS_NO_PATHCONV: "1"
      run: |
        bazel test //... --build_event_json_file="${BASHTEST_CI_REPORTS}/root-default.json"
        bazel run //tools:ci_reports -- collect --events "${BASHTEST_CI_REPORTS}/root-default.json" --output "${BASHTEST_CI_REPORTS}/root-default"
        bazel test --enable_runfiles=no //... --build_event_json_file="${BASHTEST_CI_REPORTS}/root-manifest.json"
        bazel run //tools:ci_reports -- collect --events "${BASHTEST_CI_REPORTS}/root-manifest.json" --output "${BASHTEST_CI_REPORTS}/root-manifest"
    - name: Test external module consumer
      if: runner.os != 'Windows'
      env:
        MSYS_NO_PATHCONV: "1"
      shell: bash
      run: |
        bash bashtest/tests/external_consumer_test.sh
        bash bashtest/tests/tools_consumer_test.sh

    - name: Test Windows without installed Unix tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./bashtest/tests/windows_runtime_test.ps1

    - name: Summarize JUnit results
      if: always()
      env:
        MSYS_NO_PATHCONV: "1"
      shell: bash
      run: bazel run //tools:ci_reports -- finalize "${BASHTEST_CI_REPORTS}" --destination "${BASHTEST_CI_REPORTS}" --output "${GITHUB_STEP_SUMMARY}"

    - name: Retain test diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: ${{ runner.temp }}/test-results
        if-no-files-found: warn
        retention-days: 7

  done:
    permissions:
      contents: read
      actions: read
    needs: [release-site-tests, pre-commit, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure every job is wired into this gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Parse the workflow with a real YAML reader (yq) and fail if any
          # declared job (other than this gate) is absent from `needs` above, so
          # a newly added job cannot silently escape the required gate.
          declared="$(yq '.jobs | keys | .[]' .github/workflows/main.yml |
            grep -vx done | sort)"
          wired="$(jq -r 'keys[]' <<<"${NEEDS_JSON}" | sort)"
          missing="$(comm -23 <(printf '%s\n' "${declared}") <(printf '%s\n' "${wired}"))"
          if [[ -n "${missing}" ]]; then
            echo "Jobs declared in the workflow but missing from done.needs:"
            while read -r job; do
              echo "  - ${job}"
              echo "::error title=Gate is missing a job::${job} not in done.needs"
            done <<<"${missing}"
            exit 1
          fi
          echo "done covers all $(grep -c . <<<"${declared}") workflow jobs."
      - name: Report repository cache usage
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh cache list --limit 10000 --json key,ref,sizeInBytes >cache-inventory.json; then
            python3 - <<'PYTHON' >>"${GITHUB_STEP_SUMMARY}"
          import json
          caches = json.load(open("cache-inventory.json", encoding="utf-8"))
          size = sum(entry["sizeInBytes"] for entry in caches)
          print(f"Actions caches: {len(caches)} entries, {size:,} compressed bytes.")
          print("\nLargest entries:")
          for entry in sorted(caches, key=lambda item: item["sizeInBytes"], reverse=True)[:10]:
              print(f"- {entry['key']}: {entry['sizeInBytes']:,} bytes ({entry['ref']})")
          PYTHON
          else
            echo "Cache inventory unavailable." >>"${GITHUB_STEP_SUMMARY}"
          fi
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
